# Netlify: el sitio se construye desde la raíz del monorepo.
[build]
  command = "npm run build:web"
  publish = "apps/web/dist"

[build.environment]
  NODE_VERSION = "22"

# Proxy al API de Render. Va antes que la regla del SPA.
# Cambia el nombre del servicio si en Render usas otro.
[[redirects]]
  from = "/api/*"
  to = "https://caminos-api.onrender.com/api/:splat"
  status = 200
  force = true

# Fotos: se piden a este mismo dominio y Netlify las trae del Worker de Cloudflare (y las guarda en
# su caché). Así se ven aunque un operador bloquee las direcciones de Cloudflare (p. ej. los bloqueos
# de LaLiga en España durante los partidos). En Render, PUBLIC_ASSETS_URL = https://encaminos.netlify.app
[[redirects]]
  from = "/fotos/*"
  to = "https://caminos-fotos.j4alonso.workers.dev/fotos/:splat"
  status = 200
  force = true

# Los archivos de /assets/ cambian de nombre en cada despliegue: si uno ya no existe, 404
# (y no index.html, que el navegador rechaza como script y rompe la página)
[[redirects]]
  from = "/assets/*"
  to = "/404.html"
  status = 404

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

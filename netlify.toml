# Netlify: el sitio se construye desde la raíz del monorepo.
[build]
  command = "npm run build:web"
  publish = "apps/web/dist"

[build.environment]
  NODE_VERSION = "22"

# Proxy al API de Render. Va antes que la regla del SPA.
# Cambia el nombre del servicio si en Render usas otro.
[[redirects]]
  from = "/api/*"
  to = "https://caminos-api.onrender.com/api/:splat"
  status = 200
  force = true

# Fotos: se piden a este mismo dominio y Netlify las trae del Worker de Cloudflare (y las guarda en
# su caché). Así se ven aunque un operador bloquee las direcciones de Cloudflare (p. ej. los bloqueos
# de LaLiga en España durante los partidos). En Render, PUBLIC_ASSETS_URL = https://andando.netlify.app
[[redirects]]
  from = "/fotos/*"
  to = "https://caminos-fotos.j4alonso.workers.dev/fotos/:splat"
  status = 200
  force = true

# Los archivos de /assets/ cambian de nombre en cada despliegue: si uno ya no existe, 404
# (y no index.html, que el navegador rechaza como script y rompe la página)
[[redirects]]
  from = "/assets/*"
  to = "/404.html"
  status = 404

# iOS, si no usa el <link rel="apple-touch-icon">, prueba estos nombres en la raíz: que reciban el
# icono y no index.html (con la página en lugar de una imagen, el iPhone pone una letra como icono)
[[redirects]]
  from = "/apple-touch-icon-120x120.png"
  to = "/apple-touch-icon.png"
  status = 200
[[redirects]]
  from = "/apple-touch-icon-120x120-precomposed.png"
  to = "/apple-touch-icon.png"
  status = 200
[[redirects]]
  from = "/apple-touch-icon-152x152.png"
  to = "/apple-touch-icon.png"
  status = 200
[[redirects]]
  from = "/apple-touch-icon-167x167.png"
  to = "/apple-touch-icon.png"
  status = 200
[[redirects]]
  from = "/apple-touch-icon-180x180.png"
  to = "/apple-touch-icon.png"
  status = 200
[[redirects]]
  from = "/apple-touch-icon-180x180-precomposed.png"
  to = "/apple-touch-icon.png"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
